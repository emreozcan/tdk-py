[tool.poetry]
name = "tdk-py"
version = "0.0.0"
description = "Python API for the Turkish Language Foundation"
authors = ["Emre Özcan <emre@emreis.com>"]
readme = "README.md"
license = "MIT"
keywords = ["tdk", "turkish", "language", "nlp", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
include = ["LICENSE"]
repository = "https://github.com/emreozcan/tdk-py"
packages = [
    { include = "tdk", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.11.5,<3.16"
pydantic = "^2.14.4"
aiohttp = "^3.14.5"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
coverage = "^7.17.4"
mypy = "^2.4.1"
pytest = "^9.2.0"
pytest-cov = "^7.1.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^9.0.4"
furo = "^2025.12.19"
myst-parser = "^5.2.0"
sphinx-autobuild = "^2025.8.25"
sphinx-autodoc2 = "^0.5.0"
sphinx-copybutton = "^0.5.2"
sphinx-inline-tabs = "^2025.12.21.14"
sphinx-tippy = "^0.4.3"
dunamai = "^1.26.5"

[tool.poetry-dynamic-versioning]
enable = true

[tool.poetry-dynamic-versioning.substitution]
folders = [
    { path = "src/tdk" }
]

[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0", "poetry-dynamic-versioning>=1.10.1,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --cov=tdk --cov-report html --cov-report xml --junitxml=junit.xml -o junit_family=legacy"
pythonpath = "src"
testpaths = "tests"

[tool.black]
line-length = 80

[tool.mypy]
python_version = "3.11"
